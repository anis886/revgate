<section class="cars">

  <h2 class="title">EXPLORE YOUR BAIC</h2>

  <!-- Tabs -->
  <div class="tabs">
  <span
    *ngFor="let cat of categories"
    (click)="setCategory(cat)"
    [class.active]="selectedCategory === cat"
  >
    {{ cat }}
  </span>
</div>

  <!-- Cars List -->
<div class="cars-list">

  <div 
    class="car-card"
    *ngFor="let car of getFilteredCars()"
    (click)="selectCar(car)"
  >

    <!-- اسم العربية فوق -->
    <p class="car-name">{{ car.name }}</p>

    <!-- الصورة -->
    <img
      [src]="car.small"
      class="car-item"
      [class.active]="selectedCar === car"
    >

  </div>

</div>

  <!-- Preview -->
  <div class="car-preview">
    <img [src]="selectedCar.big" alt="selected car">
  </div>

</section>
