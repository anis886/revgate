<article class="interior-card">
  <a class="photo-link" href="#expressions" [attr.aria-label]="'View ' + model + ' interior'">
    <img [src]="image" [alt]="model + ' ' + label" loading="lazy">
  </a>
  <div class="interior-meta">
    <div>
      <h3>{{ model }}</h3>
      <p>{{ label }}</p>
    </div>
    <a class="micro-link" href="#expressions">
      <span>VIEW INTERIOR</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M14 7l5 5-5 5"/></svg>
    </a>
  </div>
</article>
